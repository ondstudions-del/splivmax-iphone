name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compilar (sin firma)
        run: |
          xcodebuild -project SPLIVMAX.xcodeproj -scheme SPLIVMAX -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SPLIVMAX.app Payload/
          zip -qry SPLIVMAX.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SPLIVMAX-ipa
          path: SPLIVMAX.ipa
